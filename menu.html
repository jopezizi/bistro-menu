<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Syö Elävältä! – Elävä Bistro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #D8E9A2;
    --green: #00774A;
    --badge: #4C6B3A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Manrope', sans-serif;
    color: var(--green);
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
  }

  #content {
    width: 1080px;
    min-height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 90px 90px 70px;
    transform-origin: top center;
  }

  h1.title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 76px;
    line-height: 1.05;
    text-align: left;
    margin: 0 0 56px;
    letter-spacing: -0.01em;
  }

  #menu-root {
    flex: 1 0 auto;
  }

  section.category {
    margin-bottom: 50px;
  }

  section.category:last-child {
    margin-bottom: 0;
  }

  h2.category-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 38px;
    margin: 0 0 16px;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 9px 0;
  }

  .item-name {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 29px;
    line-height: 1.3;
  }

  .item-badges {
    font-family: 'Manrope', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--badge);
    margin-left: 8px;
    letter-spacing: 0.01em;
  }

  .item-price {
    white-space: nowrap;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 29px;
  }

  footer {
    margin-top: 64px;
    text-align: center;
  }

  .logotype {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }

  .logotype img {
    height: 210px;
    width: auto;
  }

  /* Fallback text logotype — shown only if logo.svg is missing until the
     real logo file is dropped in. Replace with the img tag in the footer
     once elava-logo.svg (or .png) exists next to this file. */
  .logotype .fallback-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 44px;
    letter-spacing: 0.02em;
  }

  .state-message {
    text-align: left;
    font-family: 'Manrope', sans-serif;
    color: var(--green);
    opacity: 0.7;
    font-size: 28px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="content">
    <h1 class="title">Syö Elävältä!</h1>
    <div id="menu-root">
      <p class="state-message">Ladataan menua…</p>
    </div>
    <footer>
      <div class="logotype">
        <img src="elava-logo.png" alt="Elävä Bistro">
      </div>
    </footer>
  </div>
</div>

<script>
  async function loadMenu() {
    const root = document.getElementById('menu-root');
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('data.json ei latautunut (HTTP ' + res.status + ')');
      const data = await res.json();
      renderMenu(root, data);
    } catch (err) {
      root.innerHTML = '<p class="state-message">Menua ei juuri nyt saatu ladattua. (' + escapeHtml(err.message) + ')</p>';
      console.error(err);
    } finally {
      fitToCanvas();
    }
  }

  function renderMenu(root, data) {
    const categories = Array.isArray(data.categories) ? data.categories : [];
    if (categories.length === 0) {
      root.innerHTML = '<p class="state-message">Menu on tyhjä toistaiseksi.</p>';
      return;
    }

    root.innerHTML = '';
    for (const category of categories) {
      const section = document.createElement('section');
      section.className = 'category';

      const h2 = document.createElement('h2');
      h2.className = 'category-name';
      h2.textContent = category.name || '';
      section.appendChild(h2);

      const ul = document.createElement('ul');
      ul.className = 'items';

      for (const item of (category.items || [])) {
        const li = document.createElement('li');
        li.className = 'item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.name || '';

        if (Array.isArray(item.badges) && item.badges.length > 0) {
          const badgeSpan = document.createElement('span');
          badgeSpan.className = 'item-badges';
          badgeSpan.textContent = '(' + item.badges.join(', ') + ')';
          nameSpan.appendChild(badgeSpan);
        }

        const priceSpan = document.createElement('span');
        priceSpan.className = 'item-price';
        priceSpan.textContent = '•  ' + (item.price || '');

        li.appendChild(nameSpan);
        li.appendChild(priceSpan);
        ul.appendChild(li);
      }

      section.appendChild(ul);
      root.appendChild(section);
    }
  }

  function fitToCanvas() {
    const content = document.getElementById('content');
    const CANVAS_HEIGHT = 1920;

    content.style.transform = 'scale(1)';
    const naturalHeight = content.scrollHeight;

    if (naturalHeight > CANVAS_HEIGHT) {
      const scale = CANVAS_HEIGHT / naturalHeight;
      content.style.transform = 'scale(' + scale + ')';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadMenu();
  window.addEventListener('resize', fitToCanvas);
</script>
</body>
</html>
