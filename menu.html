<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Syö Elävältä! – Elävä Bistro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #C5D8AF;
    --green: #00774A;
    --badge: #4C6B3A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Bricolage Grotesque', sans-serif;
    color: var(--green);
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
  }

  /* Jokainen "sivu" (menu, tarjous) on oma täysikokoinen 1080x1920-taso,
     joka pinotaan päällekkäin ja näytetään vuorotellen suoraan ilman
     häivytystä. Jos tarjousta ei ole, #slide-tarjous-elementtiä ei koskaan
     luoda eikä mitään kierrätystä käynnisty — sivu on silloin täysin
     ennallaan. */
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    opacity: 0;
  }

  .slide.active {
    opacity: 1;
  }

  #slide-menu {
    background: var(--bg);
  }

  #content {
    width: 1080px;
    min-height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 84px 76px 64px;
    transform-origin: top center;
  }

  h1.title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-optical-sizing: none;
    font-variation-settings: 'opsz' 12;
    color: var(--green);
    font-size: 92px;
    line-height: 1.05;
    text-align: center;
    margin: 0 0 68px;
    letter-spacing: 0em;
  }

  #menu-root {
    flex: 1 0 auto;
  }

  section.category {
    margin-bottom: 62px;
  }

  section.category:last-child {
    margin-bottom: 0;
  }

  h2.category-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 48px;
    margin: 0 0 22px;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 13px 0;
  }

  .item-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    color: var(--green);
    font-size: 37px;
    line-height: 1.3;
  }

  .item-badges {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 23px;
    font-weight: 500;
    color: var(--badge);
    margin-left: 10px;
    letter-spacing: 0.01em;
  }

  .item-price {
    white-space: nowrap;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 37px;
  }

  footer {
    margin-top: 72px;
    text-align: center;
  }

  .logotype {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }

  .logotype img {
    height: 236px;
    width: auto;
  }

  /* Fallback text logotype — shown only if logo.svg is missing until the
     real logo file is dropped in. Replace with the img tag in the footer
     once elava-logo.svg (or .png) exists next to this file. */
  .logotype .fallback-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 44px;
    letter-spacing: 0.02em;
  }

  .state-message {
    text-align: left;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    color: var(--green);
    opacity: 0.7;
    font-size: 28px;
    padding: 40px 0;
  }
    .notices {
    margin-top: 40px;
    text-align: center;
  }

  .notices p {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    color: var(--green);
    opacity: 0.75;
    font-size: 24px;
    line-height: 1.5;
    margin: 0;
  }

  /* Tarjous-sivu — oma täysikokoinen "diaesitysdia", sama ulkoasu kuin
     erillisessä tarjous.html-julisteessa. Lisätään DOMiin vain jos
     tarjous.json:issa on aktiivinen tarjous. */
  #slide-tarjous {
    background: var(--green);
  }

  #offer-content {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 96px;
    padding: 96px 76px;
    color: #fff;
    transform-origin: center center;
  }

  .offer-heading {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: #fff;
    font-size: 96px;
    line-height: 1.08;
    text-align: center;
    margin: 0;
  }

  .offer-product-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: #fff;
    font-size: 58px;
    line-height: 1.25;
    text-align: center;
    margin: 0;
    max-width: 900px;
  }

  .offer-price-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: #fff;
    font-size: 168px;
    line-height: 1;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="slide-menu" class="slide active">
    <div id="content">
      <h1 class="title">Syö Elävältä!</h1>
      <div id="menu-root">
        <p class="state-message">Ladataan menua…</p>
      </div>
      <div class="notices">
        <p>L = laktoositon | G = gluteeniton | VEG = vegaaninen</p>
        <p>Lisätietoja allergeeneista saa kassalta.</p>
        <p>Käyttämämme lihatuotteet ovat peräisin EU-alueelta.</p>
      </div>
      <footer>
        <div class="logotype">
          <img src="elava-logo.png" alt="Elävä Bistro">
        </div>
      </footer>
    </div>
  </div>
  <!-- #slide-tarjous lisätään tähän JS:llä vain jos tarjous.json:issa on
       aktiivinen tarjous. Jos ei ole, tätä diaa ei koskaan synny eikä
       kiertoa käynnistetä — menu-sivu pysyy ainoana ja paikallaan. -->
</div>

<script>
  const SLIDE_DURATIONS_MS = {
    menu: 20000,
    tarjous: 15000
  };

  async function loadMenu() {
    const root = document.getElementById('menu-root');
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('data.json ei latautunut (HTTP ' + res.status + ')');
      const data = await res.json();
      renderMenu(root, data);
    } catch (err) {
      root.innerHTML = '<p class="state-message">Menua ei juuri nyt saatu ladattua. (' + escapeHtml(err.message) + ')</p>';
      console.error(err);
    } finally {
      fitToCanvas(document.getElementById('content'));
    }
  }

  function renderMenu(root, data) {
    const categories = Array.isArray(data.categories) ? data.categories : [];
    if (categories.length === 0) {
      root.innerHTML = '<p class="state-message">Menu on tyhjä toistaiseksi.</p>';
      return;
    }

    root.innerHTML = '';
    for (const category of categories) {
      const section = document.createElement('section');
      section.className = 'category';

      const h2 = document.createElement('h2');
      h2.className = 'category-name';
      h2.textContent = category.name || '';
      section.appendChild(h2);

      const ul = document.createElement('ul');
      ul.className = 'items';

      for (const item of (category.items || [])) {
        const li = document.createElement('li');
        li.className = 'item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.name || '';

        if (Array.isArray(item.badges) && item.badges.length > 0) {
          const badgeSpan = document.createElement('span');
          badgeSpan.className = 'item-badges';
          badgeSpan.textContent = '(' + item.badges.join(', ') + ')';
          nameSpan.appendChild(badgeSpan);
        }

        const priceSpan = document.createElement('span');
        priceSpan.className = 'item-price';
        priceSpan.textContent = '•  ' + (item.price || '');

        li.appendChild(nameSpan);
        li.appendChild(priceSpan);
        ul.appendChild(li);
      }

      section.appendChild(ul);
      root.appendChild(section);
    }
  }

  // Hakee tarjous.json:in. Palauttaa true ja rakentaa oman täysikokoisen
  // "sivun" #canvasin sisään VAIN jos tiedostossa on aktiivinen tarjous.
  // Kaikissa muissa tapauksissa (tiedosto puuttuu, haku epäonnistuu,
  // active:false, tyhjät kentät) palautetaan false eikä DOMiin kosketa —
  // ei virheilmoitusta, koska tarjouksen puuttuminen ei ole virhetila.
  async function loadOffer() {
    try {
      const res = await fetch('tarjous.json', { cache: 'no-store' });
      if (!res.ok) return false;

      const data = await res.json();
      const product = (data.product || '').trim();
      const price = (data.price || '').trim();
      const active = data.active !== false; // puuttuva active-kenttä = aktiivinen

      if (!active || !product || !price) return false;

      buildOfferSlide(product, price);
      fitToCanvas(document.getElementById('offer-content'));
      return true;
    } catch (err) {
      console.error('Tarjouksen haku epäonnistui (ei kriittistä, ei näytetä):', err);
      return false;
    }
  }

  function buildOfferSlide(product, price) {
    const slide = document.createElement('div');
    slide.id = 'slide-tarjous';
    slide.className = 'slide';
    slide.innerHTML =
      '<div id="offer-content">' +
        '<p class="offer-heading">Tänään<br>tarjouksessa!</p>' +
        '<p class="offer-product-text">' + escapeHtml(product) + '</p>' +
        '<p class="offer-price-text">' + escapeHtml(price) + '</p>' +
      '</div>';
    document.getElementById('canvas').appendChild(slide);
  }

  // Vaihtaa näkyvän dian ja jatkaa kiertoa — kutsutaan vain jos tarjous on
  // olemassa (slides sisältää tällöin ['menu', 'tarjous'], muuten kiertoa
  // ei koskaan käynnistetä ja menu-dia pysyy ainoana näkyvissä).
  function rotateSlides(slides) {
    const slideEls = {
      menu: document.getElementById('slide-menu'),
      tarjous: document.getElementById('slide-tarjous')
    };
    let index = 0;

    function showCurrent() {
      const activeKey = slides[index];
      Object.keys(slideEls).forEach(key => {
        if (slideEls[key]) slideEls[key].classList.toggle('active', key === activeKey);
      });
    }

    function scheduleNext() {
      const currentKey = slides[index];
      setTimeout(() => {
        index = (index + 1) % slides.length;
        showCurrent();
        scheduleNext();
      }, SLIDE_DURATIONS_MS[currentKey]);
    }

    showCurrent();
    scheduleNext();
  }

  function fitToCanvas(contentEl) {
    if (!contentEl) return;
    const CANVAS_HEIGHT = 1920;

    contentEl.style.transform = 'scale(1)';
    // force reflow so scrollHeight reflects the un-scaled layout
    const naturalHeight = contentEl.scrollHeight;

    if (naturalHeight > CANVAS_HEIGHT) {
      const scale = CANVAS_HEIGHT / naturalHeight;
      contentEl.style.transform = 'scale(' + scale + ')';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function init() {
    await loadMenu();
    const hasOffer = await loadOffer();

    if (hasOffer) {
      rotateSlides(['menu', 'tarjous']);
    }
    // Jos tarjousta ei ole, #slide-menu pysyy ainoana .active-elementtinä
    // (se on sitä jo HTML:ssä oletuksena) eikä mitään ajastusta käynnistetä.
  }

  init();
  window.addEventListener('resize', () => {
    fitToCanvas(document.getElementById('content'));
    fitToCanvas(document.getElementById('offer-content'));
  });
</script>
</body>
</html>
