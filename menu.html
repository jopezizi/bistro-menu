<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Syö Elävältä! – Elävä Bistro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #C5D8AF;
    --green: #00774A;
    --badge: #4C6B3A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Bricolage Grotesque', sans-serif;
    color: var(--green);
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
  }

  #content {
    width: 1080px;
    min-height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 84px 76px 64px;
    transform-origin: top center;
  }

  h1.title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-optical-sizing: none;
    font-variation-settings: 'opsz' 12;
    color: var(--green);
    font-size: 92px;
    line-height: 1.05;
    text-align: center;
    margin: 0 0 68px;
    letter-spacing: 0em;
  }

  #menu-root {
    flex: 1 0 auto;
  }

  section.category {
    margin-bottom: 62px;
  }

  section.category:last-child {
    margin-bottom: 0;
  }

  h2.category-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 48px;
    margin: 0 0 22px;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 13px 0;
  }

  .item-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    color: var(--green);
    font-size: 37px;
    line-height: 1.3;
  }

  .item-badges {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 23px;
    font-weight: 500;
    color: var(--badge);
    margin-left: 10px;
    letter-spacing: 0.01em;
  }

  .item-price {
    white-space: nowrap;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 37px;
  }

  /* Päivän tarjous — lisätään menun perään VAIN jos tarjous.json:issa on
     aktiivinen tarjous. #offer-root pysyy tyhjänä (eikä siis vie tilaa),
     jos tarjousta ei ole. */
  #offer-root:empty {
    display: none;
  }

  .offer-card {
    background: var(--green);
    color: #fff;
    border-radius: 32px;
    padding: 48px 56px;
    margin: 8px 0 62px;
    text-align: center;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .offer-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .offer-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 44px;
    margin: 0 0 18px;
  }

  .offer-product {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.3;
    margin: 0 0 14px;
  }

  .offer-price {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 64px;
    margin: 0;
  }

  footer {
    margin-top: 72px;
    text-align: center;
  }

  .logotype {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }

  .logotype img {
    height: 236px;
    width: auto;
  }

  /* Fallback text logotype — shown only if logo.svg is missing until the
     real logo file is dropped in. Replace with the img tag in the footer
     once elava-logo.svg (or .png) exists next to this file. */
  .logotype .fallback-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 44px;
    letter-spacing: 0.02em;
  }

  .state-message {
    text-align: left;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    color: var(--green);
    opacity: 0.7;
    font-size: 28px;
    padding: 40px 0;
  }
    .notices {
    margin-top: 40px;
    text-align: center;
  }

  .notices p {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    color: var(--green);
    opacity: 0.75;
    font-size: 24px;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="content">
    <h1 class="title">Syö Elävältä!</h1>
    <div id="menu-root">
      <p class="state-message">Ladataan menua…</p>
    </div>
    <div id="offer-root"></div>
    <div class="notices">
      <p>L = laktoositon | G = gluteeniton</p>
      <p>Lisätietoja allergeeneista saa kassalta.</p>
      <p>Käyttämämme lihatuotteet ovat peräisin EU-alueelta.</p>
    </div>
    <footer>
      <div class="logotype">
        <img src="elava-logo.png" alt="Elävä Bistro">
      </div>
    </footer>
  </div>
</div>

<script>
  async function loadMenu() {
    const root = document.getElementById('menu-root');
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('data.json ei latautunut (HTTP ' + res.status + ')');
      const data = await res.json();
      renderMenu(root, data);
    } catch (err) {
      root.innerHTML = '<p class="state-message">Menua ei juuri nyt saatu ladattua. (' + escapeHtml(err.message) + ')</p>';
      console.error(err);
    }
  }

  function renderMenu(root, data) {
    const categories = Array.isArray(data.categories) ? data.categories : [];
    if (categories.length === 0) {
      root.innerHTML = '<p class="state-message">Menu on tyhjä toistaiseksi.</p>';
      return;
    }

    root.innerHTML = '';
    for (const category of categories) {
      const section = document.createElement('section');
      section.className = 'category';

      const h2 = document.createElement('h2');
      h2.className = 'category-name';
      h2.textContent = category.name || '';
      section.appendChild(h2);

      const ul = document.createElement('ul');
      ul.className = 'items';

      for (const item of (category.items || [])) {
        const li = document.createElement('li');
        li.className = 'item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.name || '';

        if (Array.isArray(item.badges) && item.badges.length > 0) {
          const badgeSpan = document.createElement('span');
          badgeSpan.className = 'item-badges';
          badgeSpan.textContent = '(' + item.badges.join(', ') + ')';
          nameSpan.appendChild(badgeSpan);
        }

        const priceSpan = document.createElement('span');
        priceSpan.className = 'item-price';
        priceSpan.textContent = '•  ' + (item.price || '');

        li.appendChild(nameSpan);
        li.appendChild(priceSpan);
        ul.appendChild(li);
      }

      section.appendChild(ul);
      root.appendChild(section);
    }
  }

  // Päivän tarjous on täysin valinnainen lisä: jos tarjous.json puuttuu,
  // sen haku epäonnistuu, tai siinä ei ole aktiivista tarjousta, #offer-root
  // jätetään tyhjäksi eikä mitään näytetä — ei edes virheilmoitusta, koska
  // tarjouksen puuttuminen ei ole virhetila.
  async function loadOffer() {
    const container = document.getElementById('offer-root');
    try {
      const res = await fetch('tarjous.json', { cache: 'no-store' });
      if (!res.ok) return;

      const data = await res.json();
      const product = (data.product || '').trim();
      const price = (data.price || '').trim();
      const active = data.active !== false; // puuttuva active-kenttä = aktiivinen

      if (!active || !product || !price) return;

      const card = document.createElement('div');
      card.className = 'offer-card';
      card.innerHTML =
        '<p class="offer-title">Tänään tarjouksessa!</p>' +
        '<p class="offer-product">' + escapeHtml(product) + '</p>' +
        '<p class="offer-price">' + escapeHtml(price) + '</p>';
      container.appendChild(card);

      // Kaksi requestAnimationFrame-kutsua varmistaa, että selain on ehtinyt
      // maalata alkutilan (opacity 0) ennen kuin siirtymä laukaistaan —
      // muuten transition ei aina käynnisty luotettavasti.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => card.classList.add('visible'));
      });
    } catch (err) {
      console.error('Tarjouksen haku epäonnistui (ei kriittistä, ei näytetä):', err);
    }
  }

  function fitToCanvas() {
    const content = document.getElementById('content');
    const CANVAS_HEIGHT = 1920;

    content.style.transform = 'scale(1)';
    // force reflow so scrollHeight reflects the un-scaled layout
    const naturalHeight = content.scrollHeight;

    if (naturalHeight > CANVAS_HEIGHT) {
      const scale = CANVAS_HEIGHT / naturalHeight;
      content.style.transform = 'scale(' + scale + ')';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function init() {
    await loadMenu();
    await loadOffer();
    fitToCanvas();
  }

  init();
  window.addEventListener('resize', fitToCanvas);
</script>
</body>
</html>
