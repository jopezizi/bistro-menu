<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Tänään tarjouksessa! – Elävä Bistro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #00774A;
    --ink: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Bricolage Grotesque', sans-serif;
    color: var(--ink);
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
  }

  #content {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 96px;
    padding: 96px 76px;
    transform-origin: center center;
  }

  h1.title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--ink);
    font-size: 96px;
    line-height: 1.08;
    text-align: center;
    margin: 0;
    letter-spacing: 0em;
  }

  #offer-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 80px;
    width: 100%;
  }

  .product-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 58px;
    line-height: 1.25;
    text-align: center;
    margin: 0;
    max-width: 900px;
  }

  .price-text {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--ink);
    font-size: 168px;
    line-height: 1;
    text-align: center;
    margin: 0;
  }

  .state-message {
    text-align: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    color: var(--ink);
    opacity: 0.8;
    font-size: 32px;
  }
</style>
</head>
<body>
<div id="canvas">
  <div id="content">
    <h1 class="title">Tänään<br>tarjouksessa!</h1>
    <div id="offer-root">
      <p class="state-message">Ladataan tarjousta…</p>
    </div>
  </div>
</div>

<script>
  async function loadOffer() {
    const root = document.getElementById('offer-root');
    try {
      const res = await fetch('tarjous.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('tarjous.json ei latautunut (HTTP ' + res.status + ')');
      const data = await res.json();
      renderOffer(root, data);
    } catch (err) {
      root.innerHTML = '<p class="state-message">Tarjousta ei juuri nyt saatu ladattua. (' + escapeHtml(err.message) + ')</p>';
      console.error(err);
    } finally {
      fitToCanvas();
    }
  }

  function renderOffer(root, data) {
    const product = (data.product || '').trim();
    const price = (data.price || '').trim();

    if (!product && !price) {
      root.innerHTML = '<p class="state-message">Ei tarjousta juuri nyt.</p>';
      return;
    }

    root.innerHTML = '';

    if (product) {
      const p = document.createElement('p');
      p.className = 'product-text';
      p.textContent = product;
      root.appendChild(p);
    }

    if (price) {
      const priceEl = document.createElement('p');
      priceEl.className = 'price-text';
      priceEl.textContent = price;
      root.appendChild(priceEl);
    }
  }

  function fitToCanvas() {
    const content = document.getElementById('content');
    const CANVAS_HEIGHT = 1920;

    content.style.transform = 'scale(1)';
    // force reflow so scrollHeight reflects the un-scaled layout
    const naturalHeight = content.scrollHeight;

    if (naturalHeight > CANVAS_HEIGHT) {
      const scale = CANVAS_HEIGHT / naturalHeight;
      content.style.transform = 'scale(' + scale + ')';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadOffer();
  window.addEventListener('resize', fitToCanvas);
</script>
</body>
</html>
