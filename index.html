<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elävä Bistro – Menun päivitys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #D8E9A2;
    --green: #00774A;
    --ink: #1F2A1A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    margin: 0 0 32px;
    opacity: 0.8;
    line-height: 1.5;
  }

  fieldset {
    border: none;
    margin: 0 0 24px;
    padding: 0;
  }

  label {
    display: block;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    color: var(--green);
    font-size: 1.1rem;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    padding: 14px 16px;
    border: 2px solid var(--green);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
  }

  textarea:focus {
    outline: 3px solid #00774A55;
    outline-offset: 2px;
  }

  .hint {
    font-size: 0.85rem;
    opacity: 0.7;
    margin: 0 0 32px;
    line-height: 1.4;
  }

  button {
    margin-top: 8px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 20px;
    font-weight: 600;
    min-height: 1.4em;
  }

  .status.ok { color: var(--green); }
  .status.err { color: #9c2b2b; }

  .load-status {
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--green);
  }

  .load-status.err {
    color: #9c2b2b;
  }

  .load-status .retry-btn {
    margin-left: 10px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: #9c2b2b;
    background: none;
    border: 2px solid #9c2b2b;
    border-radius: 8px;
    padding: 4px 12px;
    cursor: pointer;
  }

  textarea:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  footer {
    margin-top: 56px;
    text-align: center;
  }

  .logotype {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<main>
  <h1>Päivitä menu</h1>
  <p class="subtitle">
    Muokkaa suoraan olemassa olevia tuotteita ja hintoja kategorioittain.
    Kirjoitusvirheet ja epäsiisti muotoilu eivät haittaa, ne siistitään automaattisesti.
    Kirjoita yksi tuote per rivi.
  </p>

  <p class="load-status" id="load-status" role="status" aria-live="polite">Ladataan nykyistä menua…</p>

  <form id="menu-form">
    <fieldset>
      <label for="cat-suolaista">Suolaista</label>
      <textarea id="cat-suolaista" name="cat-suolaista" placeholder="Ladataan…" disabled></textarea>
    </fieldset>

    <fieldset>
      <label for="cat-makeaa">Makeaa</label>
      <textarea id="cat-makeaa" name="cat-makeaa" placeholder="Ladataan…" disabled></textarea>
    </fieldset>

    <fieldset>
      <label for="cat-kuumat">Kuumat juomat</label>
      <textarea id="cat-kuumat" name="cat-kuumat" placeholder="Ladataan…" disabled></textarea>
    </fieldset>

    <fieldset>
      <label for="cat-kylmat">Kylmät juomat</label>
      <textarea id="cat-kylmat" name="cat-kylmat" placeholder="Ladataan…" disabled></textarea>
    </fieldset>


    <button type="submit" id="submit-btn" disabled>Lähetä menu</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <footer>
    <div class="logotype">Elävä Bistro</div>
  </footer>
</main>

<script>
  // TODO: korvaa tämä oikealla Make.com-webhookin URL:lla, kun se on saatavilla.
  // Voit myös yliajaa sen tilapäisesti osoiterivillä: index.html?webhook=https://hook.eu2.make.com/...
  const CONFIG = {
    webhookUrl: 'https://hook.eu1.make.com/vjhss7c330rf356u774o6ehhkdcl3jan'
  };

  (function applyWebhookOverride() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get('webhook');
    if (override) CONFIG.webhookUrl = override;
  })();

  const CATEGORIES = [
    { label: 'Suolaista', id: 'cat-suolaista' },
    { label: 'Makeaa', id: 'cat-makeaa' },
    { label: 'Kuumat juomat', id: 'cat-kuumat' },
    { label: 'Kylmät juomat', id: 'cat-kylmat' }
  ];

  const form = document.getElementById('menu-form');
  const button = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  function buildRawText() {
    return CATEGORIES
      .map(cat => {
        const el = document.getElementById(cat.id);
        const body = el.value.trim();
        return body ? cat.label + '\n' + body : '';
      })
      .filter(Boolean)
      .join('\n\n');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const loadStatus = document.getElementById('load-status');

  function setFieldsEnabled(enabled) {
    CATEGORIES.forEach(cat => {
      document.getElementById(cat.id).disabled = !enabled;
    });
    button.disabled = !enabled;
  }

  async function loadCurrentMenu() {
    loadStatus.textContent = 'Ladataan nykyistä menua…';
    loadStatus.className = 'load-status';

    try {
      // file:// avattuna selain estää tämän hakemisen (CORS) — sivu on aina
      // avattava osoitteesta (esim. https://jopezizi.github.io/bistro-menu/),
      // ei paikallisena tiedostona kaksoisnapauttamalla.
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('data.json ei latautunut (HTTP ' + res.status + ')');
      const data = await res.json();

      const byName = {};
      (data.categories || []).forEach(c => { byName[c.name] = c; });

      CATEGORIES.forEach(cat => {
        const found = byName[cat.label];
        const el = document.getElementById(cat.id);
        if (!found || !Array.isArray(found.items)) {
          el.value = '';
          return;
        }

        el.value = found.items
          .map(item => {
            let line = (item.name || '').trim() + ' ' + (item.price || '').trim();
            if (Array.isArray(item.badges) && item.badges.length > 0) {
              line += ' (' + item.badges.join(', ') + ')';
            }
            return line.trim();
          })
          .join('\n');
      });

      setFieldsEnabled(true);
      loadStatus.textContent = 'Nykyinen menu ladattu ' + (data.updated ? '(päivitetty ' + data.updated + ')' : '') + '.';
      loadStatus.className = 'load-status ok';
    } catch (err) {
      // Ei jätetä kenttiin vanhaa esimerkkisisältöä — se voisi näyttää
      // aidolta menulta, vaikka data ei olisikaan ajan tasalla. Kentät
      // pysyvät tyhjinä ja lukittuina kunnes lataus onnistuu.
      console.error('Nykyisen menun haku epäonnistui:', err);
      loadStatus.innerHTML = 'Menua ei saatu ladattua (' + escapeHtml(err.message) + '). Tarkista, että sivu on avattu netistä eikä paikallisena tiedostona, ja yritä uudelleen. <button type="button" class="retry-btn" id="retry-load-btn">Yritä uudelleen</button>';
      loadStatus.className = 'load-status err';
      const retryBtn = document.getElementById('retry-load-btn');
      if (retryBtn) retryBtn.addEventListener('click', loadCurrentMenu);
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    if (!CONFIG.webhookUrl || CONFIG.webhookUrl === 'REPLACE_WITH_YOUR_MAKE_WEBHOOK_URL') {
      status.textContent = 'Webhook-URL:ia ei ole vielä asetettu (katso CONFIG.webhookUrl index.html:ssä).';
      status.className = 'status err';
      return;
    }

    const text = buildRawText();
    if (!text) return;

    button.disabled = true;
    status.textContent = 'Lähetetään…';
    status.className = 'status';

    try {
      const res = await fetch(CONFIG.webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!res.ok) throw new Error('Palvelin vastasi virheellä (HTTP ' + res.status + ')');

      status.textContent = 'Menu lähetetty! Päivitys näkyy menu.html-sivulla hetken kuluttua.';
      status.className = 'status ok';
    } catch (err) {
      status.textContent = 'Lähetys epäonnistui: ' + err.message;
      status.className = 'status err';
      console.error(err);
    } finally {
      button.disabled = false;
    }
  });

  loadCurrentMenu();
</script>
</body>
</html>
