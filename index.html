<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elävä Bistro – Menun päivitys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #D8E9A2;
    --green: #00774A;
    --ink: #1F2A1A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    margin: 0 0 32px;
    opacity: 0.8;
    line-height: 1.5;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 320px;
    padding: 16px;
    border: 2px solid var(--green);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
  }

  textarea:focus {
    outline: 3px solid #00774A55;
    outline-offset: 2px;
  }

  .example {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-top: 8px;
    line-height: 1.4;
  }

  button {
    margin-top: 24px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 20px;
    font-weight: 600;
    min-height: 1.4em;
  }

  .status.ok { color: var(--green); }
  .status.err { color: #9c2b2b; }

  footer {
    margin-top: 56px;
    text-align: center;
  }

  .logotype {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--green);
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<main>
  <h1>Päivitä menu</h1>
  <p class="subtitle">
    Liitä alle menu vapaana tekstinä — kirjoitusvirheet ja epäsiisti muotoilu eivät haittaa,
    Make.com-skenaario jäsentää ja siistii sisällön automaattisesti.
  </p>

  <form id="menu-form">
    <label for="menu-text">Menuteksti</label>
    <textarea id="menu-text" name="menu-text" placeholder="Kuumat juomat / Tavallinen kahvi 2e / Erikoiskahvit 3e / Tee 2,5e (L)(G)&#10;Suolaista / Kasvispiirakka 5,5e (L) / Karjalanpiirakka 3,5e&#10;Makeaa / Korvapuusti 3e / Porkkanakakku 4,5e (G)&#10;Kylmät juomat / Vesi 1e (L)(G) / Tuoremehu 3,5e (L)(G)" required></textarea>
    <p class="example">Vinkki: erottele kategoriat ja tuotteet vaikka rivinvaihdoilla tai kauttaviivoilla — tekoäly hoitaa jäsentelyn.</p>

    <button type="submit" id="submit-btn">Lähetä menu</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <footer>
    <div class="logotype">Elävä Bistro</div>
  </footer>
</main>

<script>
  // TODO: korvaa tämä oikealla Make.com-webhookin URL:lla, kun se on saatavilla.
  // Voit myös yliajaa sen tilapäisesti osoiterivillä: index.html?webhook=https://hook.eu2.make.com/...
  const CONFIG = {
    webhookUrl: 'https://hook.eu1.make.com/vjhss7c330rf356u774o6ehhkdcl3jan'
  };

  (function applyWebhookOverride() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get('webhook');
    if (override) CONFIG.webhookUrl = override;
  })();

  const form = document.getElementById('menu-form');
  const textarea = document.getElementById('menu-text');
  const button = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    if (!CONFIG.webhookUrl || CONFIG.webhookUrl === 'REPLACE_WITH_YOUR_MAKE_WEBHOOK_URL') {
      status.textContent = 'Webhook-URL:ia ei ole vielä asetettu (katso CONFIG.webhookUrl index.html:ssä).';
      status.className = 'status err';
      return;
    }

    const text = textarea.value.trim();
    if (!text) return;

    button.disabled = true;
    status.textContent = 'Lähetetään…';
    status.className = 'status';

    try {
      const res = await fetch(CONFIG.webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!res.ok) throw new Error('Palvelin vastasi virheellä (HTTP ' + res.status + ')');

      status.textContent = 'Menu lähetetty! Päivitys näkyy menu.html-sivulla hetken kuluttua.';
      status.className = 'status ok';
    } catch (err) {
      status.textContent = 'Lähetys epäonnistui: ' + err.message;
      status.className = 'status err';
      console.error(err);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
